name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned tools
        run: python -m pip install -r requirements.lock

      - name: Lint Python scripts and tests
        run: ruff check --output-format=github scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run baseline project gate
        run: python scripts/check.py

      - name: Validate CSV structure
        run: python scripts/validate_archive.py

      - name: Verify dated archive manifest
        run: python scripts/archive_manifest.py --check

      - name: Audit pinned Python dependencies
        run: pip-audit --no-deps --timeout 5 --progress-spinner off -r requirements.lock
